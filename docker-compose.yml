services:
  evaluation-api:
    build: .
    container_name: evaluation-api

    ports:
      - "8000:8000"

    environment:
      OLLAMA_BASE_URL: "http://ollama:11434"

    depends_on:
      ollama:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  ollama:
    image: ollama/ollama:latest
    container_name: evaluation-ollama

    ports:
      - "11434:11434"

    volumes:
      - ollama_data:/root/.ollama

    healthcheck:
      test:
        [
          "CMD",
          "ollama",
          "list",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


volumes:
  ollama_data: