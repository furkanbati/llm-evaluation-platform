services:
  evaluation-api:
    build: .
    container_name: evaluation-api

    ports:
      - "8000:8000"

    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    container_name: evaluation-ollama

    ports:
      - "11434:11434"

    volumes:
      - ollama_data:/root/.ollama


volumes:
  ollama_data: